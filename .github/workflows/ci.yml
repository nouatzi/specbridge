name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Generate coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  test-integration-core:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run core integration tests (retry once on failure)
        id: integration_core
        run: |
          set +e
          npm run test:integration:core
          first_exit=$?
          if [ "$first_exit" -eq 0 ]; then
            echo "flaky=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "First core integration run failed. Retrying once..."
          npm run test:integration:core
          second_exit=$?
          if [ "$second_exit" -eq 0 ]; then
            echo "flaky=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "flaky=false" >> "$GITHUB_OUTPUT"
          exit "$second_exit"

      - name: Annotate flaky core integration
        if: steps.integration_core.outputs.flaky == 'true'
        run: |
          echo "### Flaky integration detected (core)" >> "$GITHUB_STEP_SUMMARY"
          echo "- First run failed, retry passed." >> "$GITHUB_STEP_SUMMARY"

  test-integration-cli:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run CLI integration tests (retry once on failure)
        id: integration_cli
        run: |
          set +e
          npm run test:integration:cli
          first_exit=$?
          if [ "$first_exit" -eq 0 ]; then
            echo "flaky=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "First CLI integration run failed. Retrying once..."
          npm run test:integration:cli
          second_exit=$?
          if [ "$second_exit" -eq 0 ]; then
            echo "flaky=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "flaky=false" >> "$GITHUB_OUTPUT"
          exit "$second_exit"

      - name: Annotate flaky CLI integration
        if: steps.integration_cli.outputs.flaky == 'true'
        run: |
          echo "### Flaky integration detected (cli)" >> "$GITHUB_STEP_SUMMARY"
          echo "- First run failed, retry passed." >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (ignore scripts)
        run: npm pack --ignore-scripts

      - name: Pack dry-run (hooks disabled)
        run: HUSKY=0 npm pack --dry-run

      - name: Capture package contents
        run: tar -tf *.tgz | sort > package-contents.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            *.tgz
            package-contents.txt
          retention-days: 7
