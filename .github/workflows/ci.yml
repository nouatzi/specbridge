name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Generate coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  test-integration-core:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run core integration tests (retry once on failure + runtime budget)
        id: integration_core
        shell: bash
        timeout-minutes: 12
        run: |
          set +e
          budget_seconds=120
          flaky="false"

          run_core() {
            local attempt="$1"
            local log_file="integration-core-${attempt}.log"
            local started_at ended_at status

            started_at=$(date +%s)
            npm run test:integration:core 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            ended_at=$(date +%s)
            duration_seconds=$((ended_at - started_at))

            echo "### Core integration (${attempt})" >> "$GITHUB_STEP_SUMMARY"
            echo "- status: ${status}" >> "$GITHUB_STEP_SUMMARY"
            echo "- duration: ${duration_seconds}s (budget ${budget_seconds}s)" >> "$GITHUB_STEP_SUMMARY"
            return "$status"
          }

          run_core "run1"
          first_exit=$?
          first_duration=$duration_seconds
          final_status=$first_exit

          if [ "$first_exit" -ne 0 ]; then
            echo "First core integration run failed. Retrying once..."
            run_core "run2"
            second_exit=$?
            second_duration=$duration_seconds
            final_duration=$second_duration
            final_status=$second_exit
            if [ "$second_exit" -eq 0 ]; then
              flaky="true"
            fi
          else
            final_duration=$first_duration
          fi

          mkdir -p ci-metrics
          cat > ci-metrics/integration-core.json <<EOF
          {"track":"integration-core","suite":"core","duration_seconds":${final_duration},"budget_seconds":${budget_seconds},"status":${final_status},"flaky":"${flaky}"}
          EOF

          echo "flaky=${flaky}" >> "$GITHUB_OUTPUT"
          echo "final_duration=${final_duration}" >> "$GITHUB_OUTPUT"
          if [ "$final_status" -ne 0 ]; then
            exit "$final_status"
          fi

          if [ "$final_duration" -gt "$budget_seconds" ]; then
            echo "Core integration exceeded runtime budget (${final_duration}s > ${budget_seconds}s)."
            exit 1
          fi

      - name: Annotate flaky core integration
        if: steps.integration_core.outputs.flaky == 'true'
        run: |
          echo "### Flaky integration detected (core)" >> "$GITHUB_STEP_SUMMARY"
          echo "- First run failed, retry passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload core integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-logs
          path: integration-core-*.log
          retention-days: 7

      - name: Upload core integration metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-metrics
          path: ci-metrics/integration-core.json
          if-no-files-found: ignore
          retention-days: 14

  test-integration-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [smoke, core, aux]
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run CLI integration suite (retry once on failure + runtime budget)
        id: integration_cli
        shell: bash
        timeout-minutes: 12
        run: |
          set +e
          flaky="false"
          case "${{ matrix.suite }}" in
            smoke)
              budget_seconds=90
              ;;
            core|aux)
              budget_seconds=180
              ;;
            *)
              budget_seconds=180
              ;;
          esac

          run_suite() {
            local attempt="$1"
            local log_file="integration-cli-${{ matrix.suite }}-${attempt}.log"
            local started_at ended_at status

            started_at=$(date +%s)
            npm run "test:integration:cli:${{ matrix.suite }}" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            ended_at=$(date +%s)
            duration_seconds=$((ended_at - started_at))

            echo "### CLI integration (${{ matrix.suite }} / ${attempt})" >> "$GITHUB_STEP_SUMMARY"
            echo "- status: ${status}" >> "$GITHUB_STEP_SUMMARY"
            echo "- duration: ${duration_seconds}s (budget ${budget_seconds}s)" >> "$GITHUB_STEP_SUMMARY"
            return "$status"
          }

          run_suite "run1"
          first_exit=$?
          first_duration=$duration_seconds
          final_status=$first_exit

          if [ "$first_exit" -ne 0 ]; then
            echo "First CLI integration run failed for suite '${{ matrix.suite }}'. Retrying once..."
            run_suite "run2"
            second_exit=$?
            second_duration=$duration_seconds
            final_duration=$second_duration
            final_status=$second_exit
            if [ "$second_exit" -eq 0 ]; then
              flaky="true"
            fi
          else
            final_duration=$first_duration
          fi

          mkdir -p ci-metrics
          cat > "ci-metrics/integration-cli-${{ matrix.suite }}.json" <<EOF
          {"track":"integration-cli","suite":"${{ matrix.suite }}","duration_seconds":${final_duration},"budget_seconds":${budget_seconds},"status":${final_status},"flaky":"${flaky}"}
          EOF

          echo "flaky=${flaky}" >> "$GITHUB_OUTPUT"
          echo "final_duration=${final_duration}" >> "$GITHUB_OUTPUT"
          if [ "$final_status" -ne 0 ]; then
            exit "$final_status"
          fi

          if [ "$final_duration" -gt "$budget_seconds" ]; then
            echo "CLI integration suite '${{ matrix.suite }}' exceeded runtime budget (${final_duration}s > ${budget_seconds}s)."
            exit 1
          fi

      - name: Annotate flaky CLI integration
        if: steps.integration_cli.outputs.flaky == 'true'
        run: |
          echo "### Flaky integration detected (cli / ${{ matrix.suite }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- First run failed, retry passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-cli-logs-${{ matrix.suite }}
          path: integration-cli-${{ matrix.suite }}-*.log
          retention-days: 7

      - name: Upload CLI integration metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-cli-metrics-${{ matrix.suite }}
          path: ci-metrics/integration-cli-${{ matrix.suite }}.json
          if-no-files-found: ignore
          retention-days: 14

  docs-policy:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Validate docs/runtime policy alignment
        run: npm run docs:validate

  release-metadata:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Validate package/changelog version alignment
        run: npm run release:validate

  lint:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

  eslint10-readiness:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint 10 readiness probe (informational)
        run: npm run eslint10:readiness

      - name: Enforce ESLint 10 readiness on main (toggle via repo variable)
        if: github.ref == 'refs/heads/main' && vars.ESLINT10_STRICT_GATE == 'true'
        run: npm run eslint10:readiness:strict

  module-boundaries:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check module boundaries (warning mode)
        run: npm run architecture:check-boundaries:warning

  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (ignore scripts)
        run: npm pack --ignore-scripts

      - name: Pack dry-run (hooks disabled)
        run: HUSKY=0 npm pack --dry-run

      - name: Capture package contents
        run: tar -tf *.tgz | sort > package-contents.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            *.tgz
            package-contents.txt
          retention-days: 7

  health-summary:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration-core
      - test-integration-cli
      - docs-policy
      - release-metadata
      - lint
      - eslint10-readiness
      - module-boundaries
      - build

    steps:
      - name: Download CI metrics artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*-metrics*
          merge-multiple: true
          path: ci-metrics

      - name: Build machine-readable health summary
        if: always()
        env:
          UNIT_STATUS: ${{ needs.test-unit.result }}
          INTEGRATION_CORE_STATUS: ${{ needs.test-integration-core.result }}
          INTEGRATION_CLI_STATUS: ${{ needs.test-integration-cli.result }}
          DOCS_POLICY_STATUS: ${{ needs.docs-policy.result }}
          RELEASE_METADATA_STATUS: ${{ needs.release-metadata.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          ESLINT10_READINESS_STATUS: ${{ needs.eslint10-readiness.result }}
          MODULE_BOUNDARIES_STATUS: ${{ needs.module-boundaries.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          ESLINT10_STRICT_GATE_ENABLED: ${{ vars.ESLINT10_STRICT_GATE }}
        run: |
          node <<'NODE'
          const { existsSync, readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { resolve } = require('node:path');

          const checks = {
            test_unit: process.env.UNIT_STATUS || 'unknown',
            test_integration_core: process.env.INTEGRATION_CORE_STATUS || 'unknown',
            test_integration_cli: process.env.INTEGRATION_CLI_STATUS || 'unknown',
            docs_policy: process.env.DOCS_POLICY_STATUS || 'unknown',
            release_metadata: process.env.RELEASE_METADATA_STATUS || 'unknown',
            lint: process.env.LINT_STATUS || 'unknown',
            eslint10_readiness: process.env.ESLINT10_READINESS_STATUS || 'unknown',
            module_boundaries: process.env.MODULE_BOUNDARIES_STATUS || 'unknown',
            build: process.env.BUILD_STATUS || 'unknown',
          };

          const metrics = {};
          const flakySuites = [];
          const metricsDir = resolve(process.cwd(), 'ci-metrics');
          if (existsSync(metricsDir)) {
            for (const file of readdirSync(metricsDir)) {
              if (!file.endsWith('.json')) continue;
              const raw = readFileSync(resolve(metricsDir, file), 'utf8');
              const metric = JSON.parse(raw);
              if (metric && metric.suite && metric.track) {
                const key = `${String(metric.track)}:${String(metric.suite)}`;
                const isFlaky = metric.flaky === 'true' || metric.flaky === true;
                metrics[key] = {
                  duration_seconds:
                    typeof metric.duration_seconds === 'number'
                      ? metric.duration_seconds
                      : null,
                  budget_seconds:
                    typeof metric.budget_seconds === 'number' ? metric.budget_seconds : null,
                  status: typeof metric.status === 'number' ? metric.status : null,
                  flaky: isFlaky,
                };
                if (isFlaky) {
                  flakySuites.push(key);
                }
              }
            }
          }

          const durationsSeconds = Object.fromEntries(
            Object.entries(metrics).map(([key, value]) => [key, value.duration_seconds])
          );

          const result = Object.values(checks).every((status) => status === 'success')
            ? 'success'
            : 'failure';

          const summary = {
            timestamp: new Date().toISOString(),
            node_version: process.version,
            checks,
            gates: {
              eslint10_strict_on_main: process.env.ESLINT10_STRICT_GATE_ENABLED === 'true',
            },
            durations_seconds: durationsSeconds,
            metrics,
            flakiness: {
              count: flakySuites.length,
              suites: flakySuites,
            },
            result,
          };

          writeFileSync(
            resolve(process.cwd(), 'health-summary.json'),
            `${JSON.stringify(summary, null, 2)}\n`,
            'utf8'
          );

          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload health summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-summary
          path: health-summary.json
          retention-days: 14
