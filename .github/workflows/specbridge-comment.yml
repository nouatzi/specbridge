name: SpecBridge PR Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify (JSON)
        run: |
          node dist/cli.js verify --json > result.json || true

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- specbridge-comment -->';
            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));

            const violations = Array.isArray(result.violations) ? result.violations : [];
            const success = Boolean(result.success);
            const title = success ? '✅ SpecBridge: no violations' : `❌ SpecBridge: ${violations.length} violation(s)`;

            const bySeverity = violations.reduce((acc, v) => {
              acc[v.severity] = (acc[v.severity] || 0) + 1;
              return acc;
            }, {});

            const summary = [
              title,
              '',
              `- Checked: ${result.checked ?? 0}`,
              `- Duration: ${result.duration ?? 0}ms`,
              `- Severity: ${Object.entries(bySeverity).map(([k, c]) => `${k}=${c}`).join(', ') || 'none'}`
            ].join('\n');

            const lines = [
              marker,
              '## SpecBridge',
              '',
              summary,
              '',
              violations.length > 0 ? 'Top violations:' : '',
              ...violations.slice(0, 20).map(v => `- \`${v.file}${v.line ? `:${v.line}` : ''}\` [${v.severity}] ${v.decisionId}/${v.constraintId}: ${v.message}`),
              violations.length > 20 ? `- …and ${violations.length - 20} more` : ''
            ].filter(Boolean);

            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

