<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecBridge Compliance Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f5f7fa;
      color: #2c3e50;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .loading {
      text-align: center;
      padding: 4rem;
      font-size: 1.2rem;
      color: #666;
    }

    .error {
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      color: #c33;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    .metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .metric-label {
      font-size: 0.9rem;
      color: #666;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .metric-value.success {
      color: #27ae60;
    }

    .metric-value.warning {
      color: #f39c12;
    }

    .metric-value.danger {
      color: #e74c3c;
    }

    .compliance-score {
      text-align: center;
      padding: 2rem;
    }

    .compliance-score .score {
      font-size: 4rem;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .compliance-score .label {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .trend-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .trend-indicator.up {
      background: #d4edda;
      color: #155724;
    }

    .trend-indicator.down {
      background: #f8d7da;
      color: #721c24;
    }

    .trend-indicator.stable {
      background: #fff3cd;
      color: #856404;
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-top: 1rem;
    }

    .decision-list {
      list-style: none;
    }

    .decision-item {
      padding: 0.75rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .decision-item:last-child {
      border-bottom: none;
    }

    .decision-name {
      font-weight: 500;
    }

    .decision-compliance {
      font-weight: bold;
    }

    .violation-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .violation-badge.critical {
      background: #fee;
      color: #c33;
    }

    .violation-badge.high {
      background: #fff3cd;
      color: #856404;
    }

    .violation-badge.medium {
      background: #d1ecf1;
      color: #0c5460;
    }

    .violation-badge.low {
      background: #e2e3e5;
      color: #383d41;
    }

    .insights {
      margin-top: 1rem;
    }

    .insight {
      padding: 0.75rem;
      border-left: 4px solid #ccc;
      margin-bottom: 0.75rem;
      background: #f9f9f9;
    }

    .insight.warning {
      border-color: #f39c12;
      background: #fff9e6;
    }

    .insight.success {
      border-color: #27ae60;
      background: #e8f8f0;
    }

    .insight.info {
      border-color: #3498db;
      background: #e8f4fc;
    }

    .insight-message {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .insight-details {
      font-size: 0.85rem;
      color: #666;
    }

    .timestamp {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      margin-top: 2rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Dashboard() {
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [report, setReport] = useState(null);
      const [history, setHistory] = useState([]);
      const [analytics, setAnalytics] = useState(null);

      useEffect(() => {
        loadData();
      }, []);

      async function loadData() {
        try {
          setLoading(true);
          setError(null);

          // Load latest report
          const reportRes = await fetch('/api/report/latest');
          if (!reportRes.ok) throw new Error('Failed to load report');
          const reportData = await reportRes.json();
          setReport(reportData);

          // Load history for chart
          const historyRes = await fetch('/api/report/history?days=30');
          if (historyRes.ok) {
            const historyData = await historyRes.json();
            setHistory(historyData);
          }

          // Load analytics
          const analyticsRes = await fetch('/api/analytics/summary?days=90');
          if (analyticsRes.ok) {
            const analyticsData = await analyticsRes.json();
            setAnalytics(analyticsData);
          }

          setLoading(false);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      }

      useEffect(() => {
        if (history.length > 0) {
          // Small delay to ensure canvas is fully mounted
          const timer = setTimeout(() => {
            renderChart();
          }, 100);
          return () => clearTimeout(timer);
        }
      }, [history]);

      function renderChart() {
        const ctx = document.getElementById('complianceChart');
        if (!ctx) {
          console.warn('Chart canvas not found');
          return;
        }

        try {
          // Destroy existing chart
          const existing = Chart.getChart(ctx);
          if (existing) {
            existing.destroy();
          }

          // Sort history by date
          const sorted = [...history].sort((a, b) => a.timestamp.localeCompare(b.timestamp));

          // Format dates for better readability
          const formatDate = (timestamp) => {
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          };

          new Chart(ctx, {
            type: 'line',
            data: {
              labels: sorted.map(h => formatDate(h.timestamp)),
              datasets: [{
                label: 'Compliance %',
                data: sorted.map(h => h.report.summary.compliance),
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 4,
                pointHoverRadius: 6,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: false,
                },
                tooltip: {
                  callbacks: {
                    label: (context) => `Compliance: ${context.parsed.y}%`
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  max: 100,
                  ticks: {
                    callback: (value) => value + '%'
                  }
                },
                x: {
                  ticks: {
                    maxRotation: 45,
                    minRotation: 45
                  }
                }
              }
            }
          });
        } catch (error) {
          console.error('Failed to render chart:', error);
        }
      }

      if (loading) {
        return <div className="loading">Loading dashboard data...</div>;
      }

      if (error) {
        return (
          <div className="container">
            <div className="error">
              <strong>Error:</strong> {error}
            </div>
          </div>
        );
      }

      if (!report) {
        return (
          <div className="container">
            <div className="error">No report data available. Run `specbridge report` to generate a report.</div>
          </div>
        );
      }

      return (
        <>
          <div className="header">
            <h1>📊 SpecBridge Compliance Dashboard</h1>
            <p>{report.project} - {new Date(report.timestamp).toLocaleString()}</p>
          </div>

          <div className="container">
            {/* Summary Cards */}
            <div className="grid">
              <div className="card">
                <div className="compliance-score">
                  <div className="score">{report.summary.compliance}%</div>
                  <div className="label">Overall Compliance</div>
                  {analytics && (
                    <div style={{ marginTop: '1rem' }}>
                      <span className={`trend-indicator ${analytics.overallTrend}`}>
                        {analytics.overallTrend === 'up' ? '📈' : analytics.overallTrend === 'down' ? '📉' : '➡️'}
                        {' '}
                        {analytics.overallTrend.toUpperCase()}
                      </span>
                    </div>
                  )}
                </div>
              </div>

              <div className="card">
                <h2>📋 Decisions</h2>
                <div className="metric">
                  <span className="metric-label">Total Decisions</span>
                  <span className="metric-value">{report.summary.totalDecisions}</span>
                </div>
                <div className="metric">
                  <span className="metric-label">Active Decisions</span>
                  <span className="metric-value success">{report.summary.activeDecisions}</span>
                </div>
                <div className="metric">
                  <span className="metric-label">Total Constraints</span>
                  <span className="metric-value">{report.summary.totalConstraints}</span>
                </div>
              </div>

              <div className="card">
                <h2>⚠️ Violations</h2>
                <div className="metric">
                  <span className="metric-label">Critical</span>
                  <span className={`metric-value ${report.summary.violations.critical > 0 ? 'danger' : 'success'}`}>
                    {report.summary.violations.critical}
                  </span>
                </div>
                <div className="metric">
                  <span className="metric-label">High</span>
                  <span className={`metric-value ${report.summary.violations.high > 0 ? 'warning' : 'success'}`}>
                    {report.summary.violations.high}
                  </span>
                </div>
                <div className="metric">
                  <span className="metric-label">Medium</span>
                  <span className="metric-value">{report.summary.violations.medium}</span>
                </div>
                <div className="metric">
                  <span className="metric-label">Low</span>
                  <span className="metric-value">{report.summary.violations.low}</span>
                </div>
              </div>
            </div>

            {/* Compliance Trend Chart */}
            {history.length > 1 && (
              <div className="card">
                <h2>📈 Compliance Trend (30 Days)</h2>
                <div className="chart-container">
                  <canvas id="complianceChart"></canvas>
                </div>
              </div>
            )}

            {/* Decision Breakdown */}
            <div className="card">
              <h2>🎯 Decision Compliance</h2>
              <ul className="decision-list">
                {report.byDecision.map(decision => (
                  <li key={decision.decisionId} className="decision-item">
                    <div>
                      <div className="decision-name">{decision.title}</div>
                      <div style={{ marginTop: '0.25rem' }}>
                        {decision.violations > 0 && (
                          <span className="violation-badge medium">
                            {decision.violations} violation{decision.violations !== 1 ? 's' : ''}
                          </span>
                        )}
                      </div>
                    </div>
                    <div className={`decision-compliance ${decision.compliance === 100 ? 'success' : decision.compliance < 50 ? 'danger' : 'warning'}`}>
                      {decision.compliance}%
                    </div>
                  </li>
                ))}
              </ul>
            </div>

            {/* Insights */}
            {analytics && analytics.insights && analytics.insights.length > 0 && (
              <div className="card">
                <h2>💡 Insights</h2>
                <div className="insights">
                  {analytics.insights.map((insight, i) => (
                    <div key={i} className={`insight ${insight.type}`}>
                      <div className="insight-message">{insight.message}</div>
                      {insight.details && <div className="insight-details">{insight.details}</div>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="timestamp">
              Last updated: {new Date(report.timestamp).toLocaleString()}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>
</html>
